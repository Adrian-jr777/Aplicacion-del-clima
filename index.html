<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - Tu tienda de productos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header fijo -->
    <header class="header">
        <div class="header-container">
            <div class="header-left">
                <a href="index.html" class="logo-link">
                    <div class="logo">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect width="40" height="40" rx="8" fill="#2563eb"/>
                            <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="brand">
                        <h1 class="brand-name">ShopHub</h1>
                        <p class="brand-slogan">Encuentra lo que buscas</p>
                    </div>
                </a>
            </div>
            <div class="header-right">
                <button class="btn-secondary">Crear cuenta</button>
                <button class="btn-primary">Iniciar sesión</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Sección Buscador -->
            <section class="search-section">
                <h2 class="section-title">Busca tus productos favoritos</h2>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="¿Qué estás buscando?" class="search-input">
                    <button class="search-button">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Buscar
                    </button>
                </div>
            </section>

            <!-- Sección Categorías -->
            <section class="categories-section">
                <h2 class="section-title">Categorías populares</h2>
                <div class="categories-grid">
                    <div class="category-card">
                        <div class="category-icon">📱</div>
                        <h3>Electrónica</h3>
                    </div>
                    <div class="category-card">
                        <div class="category-icon">👕</div>
                        <h3>Ropa</h3>
                    </div>
                    <div class="category-card">
                        <div class="category-icon">🏠</div>
                        <h3>Hogar</h3>
                    </div>
                    <div class="category-card">
                        <div class="category-icon">📚</div>
                        <h3>Libros</h3>
                    </div>
                    <div class="category-card">
                        <div class="category-icon">⚽</div>
                        <h3>Deportes</h3>
                    </div>
                    <div class="category-card">
                        <div class="category-icon">🎮</div>
                        <h3>Gaming</h3>
                    </div>
                </div>
            </section>

            <!-- Sección Productos Recomendados -->
            <section class="products-section">
                <h2 class="section-title">Productos recomendados</h2>
                <div id="productsGrid" class="products-grid">
                    <!-- Los productos se cargarán dinámicamente -->
                </div>
                
                <!-- Paginación -->
                <div id="pagination" class="pagination">
                    <!-- La paginación se cargará dinámicamente -->
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <div class="footer-logo">
                    <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="8" fill="#2563eb"/>
                        <path d="M12 20L18 26L28 14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <p class="footer-text">© 2025 ShopHub. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
